<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FamilyQuizz — Prototype</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    /* Warm aubergine night — designed so glassmorphism reads clearly */
    --fq-bg: #140a1f;
    --fq-bg-2: #1d0f2c;
    --fq-coral: #ff8466;        /* primary accent (was violet) */
    --fq-amber: #f5b54a;         /* secondary (was orange) */
    --fq-mint:  #6fe0c4;          /* tertiary positive (was emerald) */
    --fq-rose:  #ff6f9c;          /* alt accent */
    --fq-sky:   #7eb8ff;          /* cool counterpoint */
    --fq-red:   #ef5973;          /* error / wrong */
    --fq-ink: #fbf3ee;
    --fq-ink-dim: rgba(251, 243, 238, 0.66);
    --fq-ink-faint: rgba(251, 243, 238, 0.36);
    --fq-stroke: rgba(255, 255, 255, 0.10);
    --fq-stroke-strong: rgba(255, 255, 255, 0.20);
  }
  html, body{
    background: var(--fq-bg);
    color: var(--fq-ink);
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .font-mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* Glassmorphism base — beefed up so the frosted texture is unmistakable */
  .glass{
    background: rgba(255, 255, 255, calc(0.06 + var(--g, 0.7) * 0.09));
    backdrop-filter: blur(calc(22px + var(--g, 0.7) * 24px)) saturate(190%) brightness(1.05);
    -webkit-backdrop-filter: blur(calc(22px + var(--g, 0.7) * 24px)) saturate(190%) brightness(1.05);
    border: 1px solid rgba(255, 255, 255, calc(0.16 + var(--g, 0.7) * 0.14));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, calc(0.18 + var(--g, 0.7) * 0.14)),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04),
      0 22px 50px rgba(0, 0, 0, 0.40);
  }
  .glass-soft{
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .glass-thick{
    background: rgba(255, 255, 255, calc(0.09 + var(--g, 0.7) * 0.10));
    backdrop-filter: blur(40px) saturate(200%) brightness(1.08);
    -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.08);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
      inset 0 1.5px 0 rgba(255, 255, 255, 0.30),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 30px 70px rgba(0, 0, 0, 0.45);
  }

  /* Aurora mesh — bigger, brighter, more saturated. This is what the glass sits on. */
  .aurora{ position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .aurora::before, .aurora::after,
  .aurora > i{
    content:''; position: absolute; border-radius: 50%;
    filter: blur(70px); opacity: var(--a, 0.9); mix-blend-mode: screen;
    will-change: transform;
  }
  .aurora::before{
    width: 65vmax; height: 65vmax; left: -12vmax; top: -12vmax;
    background: radial-gradient(circle, #ff8466 0%, #ff6f9c55 35%, transparent 65%);
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .aurora::after{
    width: 60vmax; height: 60vmax; right: -18vmax; bottom: -18vmax;
    background: radial-gradient(circle, #f5b54a 0%, #ff846655 35%, transparent 65%);
    animation: drift2 26s ease-in-out infinite alternate;
  }
  .aurora > .blob-3{
    width: 50vmax; height: 50vmax; left: 28%; top: 38%;
    background: radial-gradient(circle, #6fe0c4 0%, transparent 60%);
    animation: drift3 30s ease-in-out infinite alternate;
  }
  .aurora > .blob-4{
    width: 42vmax; height: 42vmax; right: 12%; top: 0%;
    background: radial-gradient(circle, #7eb8ff 0%, transparent 60%);
    animation: drift4 18s ease-in-out infinite alternate;
  }
  .aurora > .blob-5{
    width: 38vmax; height: 38vmax; left: -8vmax; bottom: 10vh;
    background: radial-gradient(circle, #ff6f9c 0%, transparent 60%);
    animation: drift1 24s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift1{ from{transform:translate(0,0) scale(1)} to{transform:translate(15vw,10vh) scale(1.15)} }
  @keyframes drift2{ from{transform:translate(0,0) scale(1.05)} to{transform:translate(-12vw,-8vh) scale(0.95)} }
  @keyframes drift3{ from{transform:translate(-10vw,-5vh) scale(.9)} to{transform:translate(10vw,8vh) scale(1.1)} }
  @keyframes drift4{ from{transform:translate(0,0) scale(1)} to{transform:translate(-8vw,12vh) scale(.95)} }

  /* Subtle film grain */
  .grain::after{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.08; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.7'/></svg>");
  }

  /* Buzzer pulse animations */
  @keyframes buzz-pulse{
    0%{ transform: scale(1); opacity: .55 }
    100%{ transform: scale(1.6); opacity: 0 }
  }
  @keyframes buzz-breathe{
    0%, 100%{ transform: scale(1); filter: brightness(1) }
    50%{ transform: scale(1.04); filter: brightness(1.18) }
  }
  @keyframes buzz-flash{
    0%{ opacity: 1 } 60%{ opacity: 1 } 100%{ opacity: 0 }
  }
  @keyframes pop-in{
    0%{ transform: scale(0.7); opacity: 0 }
    60%{ transform: scale(1.06); opacity: 1 }
    100%{ transform: scale(1); opacity: 1 }
  }
  @keyframes rise-in{
    0%{ transform: translateY(14px); opacity: 0 }
    100%{ transform: translateY(0); opacity: 1 }
  }
  @keyframes shimmer{
    0%{ background-position: -200% 0 }
    100%{ background-position: 200% 0 }
  }
  @keyframes spin-slow{ to{ transform: rotate(360deg) } }
  @keyframes dot-bounce{
    0%, 80%, 100%{ transform: translateY(0); opacity: .5 }
    40%{ transform: translateY(-6px); opacity: 1 }
  }
  @keyframes badge-pop{
    0%{ transform: scale(0) rotate(-30deg) } 70%{ transform: scale(1.15) rotate(8deg) }
    100%{ transform: scale(1) rotate(0) }
  }

  .ring-pulse{
    position:absolute; inset:0; border-radius:9999px; border:2px solid currentColor;
    animation: buzz-pulse 1.8s cubic-bezier(.2,.7,.3,1) infinite;
  }

  /* Rectangular pulse for the full-screen buzzer */
  @keyframes rect-pulse{
    0%   { transform: scale(1);    opacity: .50; }
    100% { transform: scale(1.08); opacity: 0;   }
  }
  .rect-pulse{
    position:absolute; inset:0; border-radius:36px;
    border: 2px solid rgba(255,255,255,0.55);
    pointer-events: none;
    animation: rect-pulse 2s cubic-bezier(.2,.7,.3,1) infinite;
  }

  /* Local in-phone aurora — soft warm blobs so glass surfaces have something to blur */
  .phone-aurora{
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(60% 50% at 20% 15%,  rgba(255,132,102,0.55) 0%, transparent 70%),
      radial-gradient(55% 45% at 85% 35%,  rgba(126,184,255,0.40) 0%, transparent 70%),
      radial-gradient(70% 55% at 50% 95%,  rgba(245,181,74,0.45) 0%, transparent 70%),
      radial-gradient(45% 40% at 15% 75%,  rgba(255,111,156,0.35) 0%, transparent 70%);
    filter: saturate(115%);
  }
  .phone-aurora::after{
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 0%, rgba(20,10,31,0.45) 95%);
  }

  /* Desktop has the same idea but bigger blobs */
  .desktop-aurora{
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(45% 60% at 12% 10%, rgba(255,132,102,0.45) 0%, transparent 65%),
      radial-gradient(40% 55% at 88% 20%, rgba(245,181,74,0.40)  0%, transparent 65%),
      radial-gradient(50% 60% at 50% 105%, rgba(111,224,196,0.32) 0%, transparent 65%),
      radial-gradient(35% 45% at 95% 80%, rgba(255,111,156,0.30) 0%, transparent 65%);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar{ width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,.2); }

  /* Reset some Tailwind defaults so Space Grotesk wins */
  *{ font-family: inherit; }

  .no-tap-highlight{ -webkit-tap-highlight-color: transparent; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
